name: SL Tantra Flowable Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: GHCR image name under this repository owner
        required: true
        default: flowable-rest
      image_tag:
        description: Image tag to publish
        required: true
        default: dev
      publish_latest:
        description: Also publish latest
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Normalize image coordinates
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/${{ inputs.image_name }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and publish versioned image
        run: |
          ./mvnw clean package \
            -PdockerPublish,swagger \
            -pl :flowable-app-rest \
            -DskipTests \
            -Djib.to.image=${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }} \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -B -V --no-transfer-progress

      - name: Build and publish latest image
        if: ${{ inputs.publish_latest }}
        run: |
          ./mvnw clean package \
            -PdockerPublish,swagger \
            -pl :flowable-app-rest \
            -DskipTests \
            -Djib.to.image=${{ steps.image.outputs.image }}:latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -B -V --no-transfer-progress
