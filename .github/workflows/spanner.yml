name: Flowable Spanner Build

on:
  push:
    branches:
      - main
      - spanner-migration
      - 'flowable-release-*'
  pull_request:
    branches:
      - main
      - spanner-migration

env:
  MAVEN_ARGS: >-
    -Dmaven.javadoc.skip=true
    -B -V --no-transfer-progress
    -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

jobs:
  test_spanner:
    name: Cloud Spanner Emulator
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Restore Maven Repository Cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Test
        id: test
        run: >-
          ./mvnw test
          ${MAVEN_ARGS}
          -Pspanner
          "-Djdbc.url=jdbc:cloudspanner://localhost:9010/projects/test-project/instances/test-instance/databases/test-db;usePVGeneration=true;lenient=true;autoConfigEmulator=true"
          -Djdbc.driver=com.google.cloud.spanner.jdbc.JdbcDriver
          -pl modules/flowable-engine-common,modules/flowable-engine
          -am
          -Dtest=*Spanner*
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dmaven.test.redirectTestOutputToFile=false
      - name: Upload test artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() && steps.test.conclusion == 'failure' }}
        with:
          name: surefire-test-reports-spanner
          path: '**/target/surefire-reports/*'
